org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.44: keep legacy KGP until Flutter 3.47+ and plugins migrate
android.builtInKotlin=false
android.newDsl=false
# Fix Kotlin cache crashes on Windows (project D: / Pub cache C:)
kotlin.incremental=false
kotlin.caching.enabled=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1G
